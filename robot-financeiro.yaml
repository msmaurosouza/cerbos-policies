apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: nhi_api
  rules:
    - actions: ['GET', 'POST', 'PUT', 'DELETE']
      effect: EFFECT_ALLOW
      principal:
        roles:
          - nhi
      condition:
        match:
          expr: 'request.principal.id == "spiffe://shoracius.com.br/robot-financeiro"'
