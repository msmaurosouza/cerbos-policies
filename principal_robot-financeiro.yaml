apiVersion: api.cerbos.dev/v1
principalPolicy:
  principal: "spiffe://shoracius.com.br/robot-financeiro"
  version: "default"
  rules:
    - resource: "nhi_api"
      actions:
        - action: "GET"
          effect: EFFECT_DENY
        - action: "HEAD"
          effect: EFFECT_DENY
        - action: "OPTIONS"
          effect: EFFECT_DENY
        - action: "POST"
          effect: EFFECT_ALLOW
          condition:
            match:
              expr: "P.attr.token != ''"
        - action: "PUT"
          effect: EFFECT_ALLOW
          condition:
            match:
              expr: "P.attr.token != ''"
        - action: "PATCH"
          effect: EFFECT_ALLOW
          condition:
            match:
              expr: "P.attr.token != ''"
        - action: "DELETE"
          effect: EFFECT_ALLOW
          condition:
            match:
              expr: "P.attr.token != ''"
